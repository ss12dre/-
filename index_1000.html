var recipes = raw.map(function(r, idx){
  if(r[0] === 'snack'){
    return {id: 'snk'+idx, type:'snack', e:r[1], name:r[2], time:r[3], kcal:r[4], p:r[5], ing:r[6], steps:r[7]};
  } else {
    var typeMap = {m:'meat', c:'chicken', f:'fish', v:'vegetarian', e:'vegan'};
    var type = typeMap[r[0]];
    var prot = r[1], starch = starches[r[2]], veg = veggies[r[3]], sauce = sauces[r[4]];
    var time = r[5], kcal = r[6], p = r[7], emoji = r[8];
    var name = prot + ', ' + starch + ' et ' + veg;

    var steps = [

      'Assembler le tout et servir chaud.'

var selected='all', last=-1, history=[];
var buttons=document.querySelectorAll('.type');
var message=document.getElementById('message');
var result=document.getElementById('result');
var content=document.getElementById('content');
var counter=document.getElementById('counter');

function choose(type){
  selected=type;
  for(var i=0;i<buttons.length;i++){buttons[i].classList.toggle('active',buttons[i].getAttribute('data-type')===type)}
  message.textContent='';
  updateCounter();
}
function currentList(){
  var list=[];
  for(var i=0;i<recipes.length;i++){
    if(selected==='all' || recipes[i].type===selected){list.push(recipes[i])}
  }
  return list;
}
function updateCounter(){
  var n = currentList().length;
  counter.textContent = n + ' recettes disponibles dans cette catégorie';
}
function showRecipe(){
  var list=currentList();
  if(list.length===0){message.textContent='Aucune recette trouvée. Choisis une autre catégorie.';return}
  var possible=[];
  for(var j=0;j<list.length;j++){
    if(list.length<=history.length || history.indexOf(list[j].id)===-1){possible.push(list[j])}
  }
  if(possible.length===0){history=[];possible=list}
  var r=possible[Math.floor(Math.random()*possible.length)];
  history.push(r.id);
  if(history.length>50){history.shift()}
  content.innerHTML='<div class="food">'+r.e+'</div><p class="tag">Recette équilibrée</p><h2>'+r.name+'</h2><div class="meta">⏱ '+r.time+' min<br>🔥 '+r.kcal+' kcal<br>💪 '+r.p+' g de protéines</div><div class="cols"><div><h3>Ingrédients</h3><ul>'+r.ing.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ul></div><div><h3>Préparation</h3><ol>'+r.steps.map(function(x){return '<li>'+x+'</li>'}).join('')+'</ol></div></div>';
  result.classList.add('show');
  result.scrollIntoView({behavior:'smooth',block:'start'});
}
for(var i=0;i<buttons.length;i++){
  buttons[i].onclick=function(){choose(this.getAttribute('data-type'))}
}
document.getElementById('suggest').onclick=showRecipe;
document.getElementById('again').onclick=showRecipe;
choose('all');
